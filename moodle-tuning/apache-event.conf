# Apache event MPM + PHP-FPM for Moodle (loaded by moodle-tuning/start.sh).
#
# Event MPM: idle keep-alive connections are parked in a listener thread instead of holding a worker,
# so browsers keeping connections open no longer exhaust the worker pool (the prefork problem).

<IfModule mpm_event_module>
    ServerLimit              16
    StartServers              4
    ThreadsPerChild          64
    MaxRequestWorkers      1024
    MinSpareThreads          64
    MaxSpareThreads         512
    AsyncRequestWorkerFactor  4
    MaxConnectionsPerChild    0
</IfModule>

KeepAlive On
KeepAliveTimeout 2
MaxKeepAliveRequests 500

# All PHP goes to the PHP-FPM pool (mod_php only works with prefork).
<FilesMatch "\.php$">
    SetHandler "proxy:unix:/opt/bitnami/php/var/run/www.sock|fcgi://localhost"
</FilesMatch>
# No enablereuse: with PHP-FPM a reused connection pins an FPM child to an idle Apache connection,
# and once pooled connections outnumber pm.max_children new requests hang until ProxyTimeout.
ProxyTimeout 300
# Request bodies up to ~2 GB (lecture video uploads; Apache's default cap is 1 GiB). Matches post_max_size in PHP-FPM.
LimitRequestBody 2202009600
# Pass HTTP Authorization through to PHP (web services).
SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

# Unknown URLs (e.g. /site/index.php) get Moodle's themed "page not found" page instead of Apache's bare one.
ErrorDocument 404 /error/index.php

# Public certificate of the private IIIT Dharwad LMS CA (tls/make-certs.sh). Students install it once per device;
# it is served on plain http too (http://<host>:9999/lms-ca.crt) so it can be fetched before https is trusted.
Alias /lms-ca.crt /opt/lms-ca/iiitdwd-lms-ca.crt
<Directory /opt/lms-ca>
    Require all granted
</Directory>
<Location /lms-ca.crt>
    ForceType application/x-x509-ca-cert
    Header set Content-Disposition "attachment; filename=iiitdwd-lms-ca.crt"
</Location>

# JupyterHub (mod_jupyter) at https://<moodle>/jupyter/: same origin and certificate as Moodle, so the notebook
# iframe is never blocked as mixed content. WebSockets (kernels, terminals) are upgraded by mod_proxy_http.
RedirectMatch 301 ^/jupyter$ /jupyter/
<Location /jupyter/>
    <If "%{HTTPS} != 'on'">
        Require all denied
    </If>
    ProxyPass http://jupyterhub:8000/jupyter/ upgrade=websocket timeout=3600
    ProxyPassReverse http://jupyterhub:8000/jupyter/
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
</Location>

# Mailpit web inbox (Moodle's outgoing mail) at https://<moodle>/mail/, password-protected by Mailpit itself.
RedirectMatch 301 ^/mail$ /mail/
<Location /mail/>
    <If "%{HTTPS} != 'on'">
        Require all denied
    </If>
    ProxyPass http://mailpit:8025/mail/ upgrade=websocket
    ProxyPassReverse http://mailpit:8025/mail/
    ProxyPreserveHost On
</Location>
