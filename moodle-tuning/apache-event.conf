# Apache event MPM + PHP-FPM for Moodle (loaded by moodle-tuning/start.sh).
#
# Event MPM: idle keep-alive connections are parked in a listener thread instead of holding a worker,
# so browsers keeping connections open no longer exhaust the worker pool (the prefork problem).

<IfModule mpm_event_module>
    ServerLimit              16
    StartServers              4
    ThreadsPerChild          64
    MaxRequestWorkers      1024
    MinSpareThreads          64
    MaxSpareThreads         512
    AsyncRequestWorkerFactor  4
    MaxConnectionsPerChild    0
</IfModule>

KeepAlive On
KeepAliveTimeout 2
MaxKeepAliveRequests 500

# All PHP goes to the PHP-FPM pool (mod_php only works with prefork).
<FilesMatch "\.php$">
    SetHandler "proxy:unix:/opt/bitnami/php/var/run/www.sock|fcgi://localhost"
</FilesMatch>
# No enablereuse: with PHP-FPM a reused connection pins an FPM child to an idle Apache connection,
# and once pooled connections outnumber pm.max_children new requests hang until ProxyTimeout.
ProxyTimeout 300
# Pass HTTP Authorization through to PHP (web services).
SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
