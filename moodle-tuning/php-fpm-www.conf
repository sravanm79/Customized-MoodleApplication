; PHP-FPM pool for Moodle (replaces the Bitnami default pm=ondemand / max_children=5).
; max_children is the number of PHP requests executed at the same time. Moodle is CPU-bound per request,
; so ~4x the 28 host threads; each child is ~40-80 MB -> worst case ~8 GB.
[www]
user = daemon
group = daemon
listen = /opt/bitnami/php/var/run/www.sock
listen.owner = daemon
listen.group = daemon
listen.mode = 0660
; Requests beyond max_children wait here instead of failing.
listen.backlog = 4096

pm = dynamic
pm.max_children = 112
pm.start_servers = 32
pm.min_spare_servers = 16
pm.max_spare_servers = 64
pm.max_requests = 2000

; Long enough for a teacher uploading a 2 GB lecture video over Wi-Fi, and for Moodle (pluginfile.php) streaming a
; video to a student, which holds one PHP child for the whole transfer.
request_terminate_timeout = 1800

; Lecture video uploads (Moodle's "Maximum uploaded file size" can only go up to these).
php_admin_value[upload_max_filesize] = 2048M
php_admin_value[post_max_size] = 2100M

include=/opt/bitnami/php/etc/environment.conf
include=/opt/bitnami/php/etc/common.conf
